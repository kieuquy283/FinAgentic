version: '3.9'
services:
  postgres:
    image: postgres:16
    container_name: finagentic-postgres
    environment:
      POSTGRES_DB: finagentic
      POSTGRES_USER: finagentic
      POSTGRES_PASSWORD: finagentic
    ports:
      - "5432:5432"
    volumes:
      - finagentic_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U finagentic -d finagentic"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  finagentic_pg_data:
